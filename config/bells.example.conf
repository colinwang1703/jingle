# === Jingle 铃声配置示例 ===
# 格式说明: (周几) 文件名, 时间1, 时间2...

# 1. 工作日作息 (周一至周五)
# 早上起床
(1,2,3,4,5) bed_up_bell.mp3, 07:00

# 上课铃
(1,2,3,4,5) class_bell.mp3, 08:00, 08:50, 09:50, 10:40, 14:00, 14:50

# 下课铃
(1,2,3,4,5) break_bell.mp3, 08:45, 09:35, 10:35, 11:25, 14:45, 15:35

# 2. 周末作息 (周六、周日)
# 晚一点起床
(6,7) bed_up_bell.mp3, 09:00

# 3. 每日通用
# 午休结束
bed_up_bell.mp3, 13:30

# 晚安铃
bed_down_bell.mp3, 22:30

# 4. 随机音乐播放
# 每天傍晚随机播放一首轻松的音乐
[500miles.mp3, faded.mp3, thats_life.mp3], 18:00

# 5. 通配符示例
# 晚上22点，播放任意 jazz 开头的音乐
[jazz_*.mp3], 22:00

# 6. 临时禁用的时间点示例 (前面加 - 号)
# 下面这个 06:00 不会响
morning_alarm.mp3, -06:00
